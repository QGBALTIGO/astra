name: Astra customer portal verification
on:
  push:
    paths: ['packages/ui/**', '.github/workflows/astra-customer-premium.yml']
  pull_request:
    paths: ['packages/ui/**', '.github/workflows/astra-customer-premium.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-customer-premium-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm --filter @ownpilot/ui... install --frozen-lockfile
      - name: Customer unit tests and production build
        run: |
          pnpm --filter @ownpilot/ui exec vitest run src/pages/customer
          pnpm --filter @ownpilot/ui build
      - name: Install browser engines and accessibility auditor
        run: |
          pnpm --filter @ownpilot/ui exec playwright install chromium firefox webkit --with-deps
          npm ci --prefix landing --ignore-scripts --no-audit --no-fund
      - name: Exercise production build, login, records, expiry, layout and accessibility
        env:
          ASTRA_AXE_SCRIPT: ${{ github.workspace }}/landing/node_modules/axe-core/axe.min.js
        run: |
          if [ -d packages/ui/e2e/customer-premium-snapshots ]; then
            pnpm --filter @ownpilot/ui exec playwright test --config=e2e/customer-premium.config.ts --update-snapshots
          else
            pnpm --filter @ownpilot/ui exec playwright test --config=e2e/customer-premium.config.ts --update-snapshots
            pnpm --filter @ownpilot/ui exec playwright test --config=e2e/customer-premium.config.ts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-customer-evidence
          path: |
            packages/ui/customer-premium-report
            packages/ui/test-results
            packages/ui/e2e/customer-premium-snapshots
            packages/ui/dist
          retention-days: 14
