name: Astra customer portal verification
on:
  push:
    paths: ['packages/ui/**', '.github/workflows/astra-customer-premium.yml']
  pull_request:
    paths: ['packages/ui/**', '.github/workflows/astra-customer-premium.yml']
  workflow_dispatch:
    inputs:
      refresh_visual_baselines:
        description: 'Regenerate visual references after an intentional design change, then verify them'
        required: false
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
concurrency:
  group: astra-customer-premium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm --filter @ownpilot/ui... install --frozen-lockfile
      - name: Customer unit tests and production build
        run: |
          pnpm --filter @ownpilot/ui exec vitest run src/pages/customer
          pnpm --filter @ownpilot/ui build
      - name: Install browser engines and accessibility auditor
        run: |
          pnpm --filter @ownpilot/ui exec playwright install chromium firefox webkit --with-deps
          npm ci --prefix landing --ignore-scripts --no-audit --no-fund
      - name: Exercise production build, login, records, expiry, layout and accessibility
        env:
          ASTRA_AXE_SCRIPT: ${{ github.workspace }}/landing/node_modules/axe-core/axe.min.js
        run: |
          # Explicit review opt-in only: manual dispatch or a marked pull request.
          # Reusable runs inherit the caller's github.workflow, so publication
          # cannot refresh references. Generated Linux PNGs remain review artifacts:
          # review and commit them, then remove the PR marker before publication.
          if [ "${{ github.workflow == 'Astra customer portal verification' && ((github.event_name == 'workflow_dispatch' && inputs.refresh_visual_baselines) || (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '[refresh-approved-visuals]'))) }}" = "true" ]; then
            pnpm --filter @ownpilot/ui exec playwright test customer-premium.spec.ts --config=e2e/customer-premium.config.ts --update-snapshots
          elif [ ! -d packages/ui/e2e/customer-premium-snapshots ] || ! find packages/ui/e2e/customer-premium-snapshots -name '*.png' -print -quit | grep -q .; then
            echo 'Committed Linux visual references are required. Refresh them explicitly, review and commit them before publishing.'
            exit 1
          fi
          pnpm --filter @ownpilot/ui exec playwright test --config=e2e/customer-premium.config.ts
          pnpm --filter @ownpilot/ui exec playwright test --config=e2e/customer-update.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-customer-visual-references
          path: packages/ui/e2e/customer-premium-snapshots
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-customer-evidence
          path: |
            packages/ui/customer-premium-report
            packages/ui/test-results
            packages/ui/e2e/customer-premium-snapshots
            packages/ui/dist
          retention-days: 14
