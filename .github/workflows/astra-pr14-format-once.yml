name: Format Astra agentic UI once
on:
  push:
    branches:
      - fix/astra-agentic-ptbr-mobile-20261108
    paths:
      - .github/workflows/astra-pr14-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format affected UI files
        run: pnpm exec prettier --write packages/ui/e2e/agentic-mobile-layout.spec.ts packages/ui/src/components/dashboard/AgenticExecutionsWidget.tsx packages/ui/src/pages/agentic-ptbr.ts packages/ui/src/pages/AgenticPage.test.tsx packages/ui/src/pages/AgenticPage.tsx
      - name: Commit formatted files and delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add packages/ui/e2e/agentic-mobile-layout.spec.ts packages/ui/src/components/dashboard/AgenticExecutionsWidget.tsx packages/ui/src/pages/agentic-ptbr.ts packages/ui/src/pages/AgenticPage.test.tsx packages/ui/src/pages/AgenticPage.tsx
          git rm .github/workflows/astra-pr14-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(astra): formatar componentes pt-BR e responsivos da PR14"
          git push origin HEAD:fix/astra-agentic-ptbr-mobile-20261108
