name: Astra finance PR one-shot formatter
on:
  push:
    branches: [fix/financiamentos-groq-whatsapp-20261109]
    paths: [.github/workflows/format-finance-one-shot.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/financiamentos-groq-whatsapp-20261109
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format finance code
        run: pnpm exec prettier --write packages/gateway/src/db/schema/finance.ts packages/gateway/src/db/schema/index.test.ts packages/gateway/src/db/repositories/finance-obligations.ts packages/gateway/src/db/repositories/finance-obligations.test.ts packages/gateway/src/channels/finance-routing.ts packages/gateway/src/channels/finance-routing.test.ts packages/gateway/src/channels/channel-ai-routing.ts packages/gateway/src/tools/financing-tools.ts packages/gateway/src/tools/registry/core-registration.ts packages/gateway/src/services/agent/service.ts packages/gateway/src/services/agent/prompt.ts
      - name: Commit formatted source
        run: |
          git add packages/gateway/src/db/schema/finance.ts packages/gateway/src/db/schema/index.test.ts packages/gateway/src/db/repositories/finance-obligations.ts packages/gateway/src/db/repositories/finance-obligations.test.ts packages/gateway/src/channels/finance-routing.ts packages/gateway/src/channels/finance-routing.test.ts packages/gateway/src/channels/channel-ai-routing.ts packages/gateway/src/tools/financing-tools.ts packages/gateway/src/tools/registry/core-registration.ts packages/gateway/src/services/agent/service.ts packages/gateway/src/services/agent/prompt.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(finance): apply Prettier to financing flow"
            git push origin HEAD:fix/financiamentos-groq-whatsapp-20261109
          fi
