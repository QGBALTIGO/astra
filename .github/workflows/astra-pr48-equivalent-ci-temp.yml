name: Astra PR48 equivalent QA (temporary)
on:
  push:
    branches:
      - ci/astra-pr48-validation-20261111
permissions:
  contents: read
jobs:
  full-ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ownpilot
          POSTGRES_PASSWORD: ownpilot_ci_password
          POSTGRES_DB: ownpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit:prod
      - name: Build
        run: pnpm build
      - name: TypeCheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test (all packages, force no cache)
        env:
          TURBO_FORCE: 'true'
        run: pnpm test
      - name: Format Check
        if: always()
        run: pnpm format:check
