# Temporary, branch-scoped formatter. Removed after one successful formatting pass.
name: Format Astra multimodal work branch

on:
  push:
    branches:
      - fix/multimodal-attachments-stt-20261110
    paths:
      - .github/workflows/format-multimodal-branch.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'QGBALTIGO/astra'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true
      - name: Set up Node and pnpm
        uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@10.29.3 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply project Prettier formatting only to modified files
        run: |
          pnpm exec prettier --write \
            .github/workflows/ci.yml \
            packages/core/src/agent/tool-config.ts \
            packages/core/src/agent/tools/audio-tools.ts \
            packages/gateway/src/services/channel-asset-store.ts \
            packages/gateway/src/services/channel-asset-store.test.ts \
            packages/gateway/src/services/multimodal/transcription.ts \
            packages/gateway/src/services/multimodal/transcription.test.ts \
            packages/gateway/src/services/multimodal/translation.ts \
            packages/gateway/src/services/multimodal/translation.test.ts \
            packages/gateway/src/services/multimodal/document.ts \
            packages/gateway/src/channels/normalizers/media-understanding.ts \
            packages/gateway/src/channels/normalizers/media-understanding.test.ts \
            packages/gateway/src/tools/overrides/audio.ts \
            packages/gateway/src/tools/overrides/audio.test.ts \
            packages/gateway/src/services/tool-providers/index.ts \
            packages/gateway/src/services/tool/executor.test.ts \
            packages/gateway/src/tools/provider-manifest.ts \
            scripts/astra-multimodal-smoke.mjs docs/astra-multimodal.md
      - name: Commit only formatting diffs to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml packages/core/src/agent \
            packages/gateway/src scripts/astra-multimodal-smoke.mjs docs/astra-multimodal.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(multimodal): apply repository prettier formatting'
            git push origin HEAD:refs/heads/fix/multimodal-attachments-stt-20261110
          fi
