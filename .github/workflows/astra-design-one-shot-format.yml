name: Astra visual redesign formatting
on:
  push:
    branches:
      - design/astra-orion-visual-system-20261107
    paths:
      - .github/workflows/astra-design-one-shot-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed UI files
        run: >-
          pnpm exec prettier --write packages/ui/src/index.css packages/ui/src/components/Layout.tsx packages/ui/src/components/Sidebar.tsx packages/ui/src/components/sidebar/PinnedNavLink.tsx packages/ui/src/types/layout-config.ts packages/ui/src/constants/sidebar-sections.ts packages/ui/src/hooks/useLayoutConfig.tsx packages/ui/src/pages/DashboardPage.tsx packages/ui/src/components/ProvidersTab.tsx packages/ui/src/components/ai-models/AIModelsTab.tsx packages/ui/src/pages/ChannelsPage.tsx packages/ui/src/pages/WorkflowsPage.tsx packages/ui/src/pages/skills/SkillsHubPage.tsx packages/ui/src/pages/LayoutConfigPage.tsx packages/ui/src/pages/HabitsPage.tsx packages/ui/src/pages/CodingAgentsPage.tsx packages/ui/src/pages/MissionControlPage.tsx packages/ui/src/pages/MissionControlPage.test.tsx packages/ui/src/pages/TunnelPage.tsx packages/ui/src/pages/WorkflowToolSettingsPage.tsx packages/ui/src/pages/ProfilePage.tsx packages/ui/src/pages/ConnectedAppsPage.tsx
      - name: Commit formatted changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add packages/ui/src/index.css packages/ui/src/components/Layout.tsx packages/ui/src/components/Sidebar.tsx packages/ui/src/components/sidebar/PinnedNavLink.tsx packages/ui/src/types/layout-config.ts packages/ui/src/constants/sidebar-sections.ts packages/ui/src/hooks/useLayoutConfig.tsx packages/ui/src/pages/DashboardPage.tsx packages/ui/src/components/ProvidersTab.tsx packages/ui/src/components/ai-models/AIModelsTab.tsx packages/ui/src/pages/ChannelsPage.tsx packages/ui/src/pages/WorkflowsPage.tsx packages/ui/src/pages/skills/SkillsHubPage.tsx packages/ui/src/pages/LayoutConfigPage.tsx packages/ui/src/pages/HabitsPage.tsx packages/ui/src/pages/CodingAgentsPage.tsx packages/ui/src/pages/MissionControlPage.tsx packages/ui/src/pages/MissionControlPage.test.tsx packages/ui/src/pages/TunnelPage.tsx packages/ui/src/pages/WorkflowToolSettingsPage.tsx packages/ui/src/pages/ProfilePage.tsx packages/ui/src/pages/ConnectedAppsPage.tsx
          git rm .github/workflows/astra-design-one-shot-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(astra): format responsive Orion redesign"
          git push origin HEAD:design/astra-orion-visual-system-20261107
