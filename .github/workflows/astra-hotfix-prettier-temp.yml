name: Temporary Astra hotfix formatting
on:
  push:
    branches:
      - fix/astra-opinion-channel-response-20261111
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format only the hotfix source files
        run: |
          npx --yes prettier@3.9.5 --write \
            packages/gateway/src/channels/channel-ai-routing.ts \
            packages/gateway/src/channels/response-safety.test.ts \
            packages/gateway/src/channels/tool-selection.test.ts \
            packages/gateway/src/services/middleware/agent-execution.ts
      - name: Commit formatted files on the hotfix branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            packages/gateway/src/channels/channel-ai-routing.ts \
            packages/gateway/src/channels/response-safety.test.ts \
            packages/gateway/src/channels/tool-selection.test.ts \
            packages/gateway/src/services/middleware/agent-execution.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(astra): apply Prettier to WhatsApp hotfix"
            git push origin HEAD:refs/heads/fix/astra-opinion-channel-response-20261111
          fi
