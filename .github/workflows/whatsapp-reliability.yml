name: WhatsApp reliability regression
on:
  push:
    branches: ['fix/whatsapp-reliability-20261110']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whatsapp-reliability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Snapshot tracked source for isolated inspection
        run: git archive --format=tar HEAD > /tmp/astra-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: astra-source-review
          path: /tmp/astra-source.tar
          retention-days: 1
