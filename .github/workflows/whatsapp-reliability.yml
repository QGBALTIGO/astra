name: WhatsApp reliability regression

on:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/gateway/**'
      - '.github/workflows/whatsapp-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core and gateway
        run: pnpm --filter @ownpilot/core --filter @ownpilot/gateway build
      - name: Core tool execution and provider regression
        run: pnpm --filter @ownpilot/core exec vitest run src/agent/whatsapp-runtime.test.ts src/agent/providers/fallback.test.ts src/agent/providers/openai-provider.test.ts src/agent/providers/openai-compatible.test.ts src/memory/personal.test.ts src/agent/tools.test.ts
      - name: Screenshot cases, memory, dates and financial safety
        run: pnpm --filter @ownpilot/gateway exec vitest run src/channels/whatsapp-reliability.test.ts src/channels/restore-history.test.ts src/channels/channel-ai-routing-access.test.ts src/channels/channel-ai-routing-concurrency.test.ts src/tools/channel-reminder-tools.test.ts src/tools/customer-finance-tools.test.ts src/db/repositories/channel-reminders-reliability.test.ts src/db/repositories/chat/messages.test.ts src/services/middleware/agent-execution.test.ts src/services/middleware/context-injection.test.ts src/services/customer-date.test.ts
      - name: Reply presentation, reminder delivery and WhatsApp transport
        run: >-
          pnpm --filter @ownpilot/gateway exec vitest run
          src/channels/response-safety.test.ts
          src/channels/response-presentation.test.ts
          src/channels/receipt-state.test.ts
          src/channels/channel-style-integration.test.ts
          src/channels/timezone-routing.test.ts
          src/channels/finance-routing.test.ts
          src/channels/customer-finance-routing.test.ts
          src/channels/relative-reminder.test.ts
          src/channels/daily-greeting.test.ts
          src/channels/channel-ai-routing-quick.test.ts
          src/channels/tool-selection.test.ts
          src/channels/plugins/whatsapp/index.test.ts
          src/channels/plugins/whatsapp/whatsapp-lifecycle.test.ts
          src/channels/plugins/whatsapp/libsignal-logging.test.ts
          src/services/channel-reminder-worker.test.ts
          src/services/daily-greeting-worker.test.ts
      - name: Lint core and gateway
        run: pnpm --filter @ownpilot/core --filter @ownpilot/gateway lint
      - name: Archive tested source
        if: always()
        run: git archive --format=tar HEAD > /tmp/astra-reviewed-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-reviewed-source
          path: /tmp/astra-reviewed-source.tar
          retention-days: 1

  screenshot-postgres:
    name: Screenshot requests with real PostgreSQL and reminder clock
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: astratest
          POSTGRES_PASSWORD: astra_screenshot_ci_only
          POSTGRES_DB: astratest_screenshots
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astratest -d astratest_screenshots"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core imports
        run: pnpm --filter @ownpilot/core build
      - name: Persist screenshot requests and dispatch a real 20-second reminder
        env:
          ASTRA_WHATSAPP_SCREENSHOT_SMOKE: '1'
          NODE_ENV: test
          DATABASE_URL: ''
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: '5432'
          POSTGRES_USER: astratest
          POSTGRES_PASSWORD: astra_screenshot_ci_only
          POSTGRES_DB: astratest_screenshots
          OWNPILOT_DATA_DIR: ${{ runner.temp }}/astra-screenshot-smoke
          LOG_LEVEL: error
        run: pnpm --filter @ownpilot/gateway exec node --import tsx scripts/whatsapp-screenshot-smoke.ts
