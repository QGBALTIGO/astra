name: Temporary Astra chat hotfix formatter
on:
  push:
    branches: [fix/astra-local-chat-natural-20261111]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the repository's Prettier rules
        run: |
          npx --yes prettier@3.9.5 --write packages/gateway/src/channels/tool-selection.ts packages/gateway/src/channels/response-safety.ts packages/gateway/src/services/middleware/agent-execution.ts packages/gateway/src/channels/channel-ai-routing.ts packages/gateway/src/services/agent/prompt.ts packages/gateway/src/services/agent/service.ts packages/gateway/src/routes/ollama-relay.ts packages/gateway/src/channels/tool-selection.test.ts packages/gateway/src/channels/response-safety.test.ts packages/gateway/src/services/middleware/agent-execution.test.ts packages/gateway/src/services/agent/service.test.ts packages/gateway/src/services/agent/prompt.test.ts
      - name: Commit code formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/gateway/src/channels/tool-selection.ts packages/gateway/src/channels/response-safety.ts packages/gateway/src/services/middleware/agent-execution.ts packages/gateway/src/channels/channel-ai-routing.ts packages/gateway/src/services/agent/prompt.ts packages/gateway/src/services/agent/service.ts packages/gateway/src/routes/ollama-relay.ts packages/gateway/src/channels/tool-selection.test.ts packages/gateway/src/channels/response-safety.test.ts packages/gateway/src/services/middleware/agent-execution.test.ts packages/gateway/src/services/agent/service.test.ts packages/gateway/src/services/agent/prompt.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(astra): apply Prettier to conversational AI hotfix"
            git push origin HEAD:refs/heads/fix/astra-local-chat-natural-20261111
          fi
