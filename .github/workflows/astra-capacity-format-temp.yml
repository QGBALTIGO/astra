name: Temporary Astra 500 capacity hotfix formatter
on:
  push:
    branches:
      - fix/astra-capacity-safety-500-audit-20261111
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format only audit files using repository style
        run: |
          npx --yes prettier@3.9.5 --write packages/gateway/src/services/message-bus.ts packages/gateway/src/services/message-bus.test.ts packages/gateway/src/channels/flood-guard.ts packages/gateway/src/channels/flood-guard.test.ts packages/gateway/src/routes/ollama-relay.ts packages/gateway/src/routes/ollama-relay.test.ts packages/gateway/src/services/capacity-smoke.test.ts docs/ASTRA_CAPACITY_AUDIT_500.md
      - name: Commit formatted files to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/gateway/src/services/message-bus.ts packages/gateway/src/services/message-bus.test.ts packages/gateway/src/channels/flood-guard.ts packages/gateway/src/channels/flood-guard.test.ts packages/gateway/src/routes/ollama-relay.ts packages/gateway/src/routes/ollama-relay.test.ts packages/gateway/src/services/capacity-smoke.test.ts docs/ASTRA_CAPACITY_AUDIT_500.md
          if ! git diff --cached --quiet; then
            git commit -m "style(astra): format capacity audit and regression tests"
            git push origin HEAD:refs/heads/fix/astra-capacity-safety-500-audit-20261111
          fi
