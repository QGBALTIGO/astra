name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Keep the build/test host stable; browsers run in the versioned E2E container below.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ownpilot
          POSTGRES_PASSWORD: ownpilot_ci_password
          POSTGRES_DB: ownpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit:prod

      - name: Build
        run: pnpm build

      - name: TypeCheck
        run: pnpm typecheck

      - name: Database delivery recovery regression
        env:
          ASTRA_REVIEW_PG_PORT: 5432
          ASTRA_REVIEW_PG_DATABASE: ownpilot
          ASTRA_REVIEW_PG_USER: ownpilot
          ASTRA_REVIEW_PG_PASSWORD: ownpilot_ci_password
          ASTRA_REVIEW_PG_VECTOR: 'true'
        run: |
          pnpm --filter @ownpilot/gateway exec vitest run \
          src/db/repositories/channel-reminders-delivery.pg.test.ts \
          src/db/repositories/settings/proactive-throttle.pg.test.ts \
          src/db/repositories/planning-integrity.pg.test.ts \
          src/db/repositories/planning-concurrency.pg.test.ts \
          src/db/repositories/channel-assets-integrity.pg.test.ts \
          src/db/repositories/daily-briefing.pg.test.ts \
          src/db/repositories/whatsapp-trials.pg.test.ts \
          src/db/repositories/memory-integrity.pg.test.ts \
          src/db/repositories/job-queue-priority.pg.test.ts \
          src/db/repositories/email-digests-recovery.pg.test.ts
          pnpm dlx bun@1.4.4 test integrations/cakto/railway-function.test.mjs scripts/astra-simulation-lab/readonly-queue-probe.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Test
        run: TURBO_FORCE=true pnpm test

      - name: Format Check
        id: format
        if: always()
        run: pnpm format:check

      - name: Show formatting diff on failure
        if: failure() && steps.format.outcome == 'failure'
        run: |
          pnpm exec prettier --write .
          git diff --no-ext-diff --exit-code

  playwright-e2e:
    name: Playwright E2E (official image)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      # Match the frozen lockfile; browsers and their Noble dependencies are already installed.
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ownpilot
          POSTGRES_PASSWORD: ownpilot_ci_password
          POSTGRES_DB: ownpilot
        options: >-
          --health-cmd "pg_isready -U ownpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          version: 10.29.3

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify preinstalled browser and bootstrap tools
        run: |
          set -euo pipefail
          for astra_bootstrap_tool in git openssl curl nohup seq; do
            command -v "$astra_bootstrap_tool" >/dev/null
          done
          pnpm --filter @ownpilot/ui exec node <<'NODE'
          const assert = require('node:assert/strict');
          const { existsSync } = require('node:fs');
          const { chromium } = require('@playwright/test');
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.equal(require('@playwright/test/package.json').version, '1.58.2');
          assert.ok(existsSync(chromium.executablePath()), 'Chromium must be preinstalled in the image');
          NODE

      - name: Build
        run: pnpm build

      - name: Boot isolated PostgreSQL gateway for Playwright
        env:
          PORT: '8080'
          HOST: '127.0.0.1'
          NODE_ENV: development
          POSTGRES_HOST: postgres
          POSTGRES_PORT: '5432'
          POSTGRES_USER: ownpilot
          POSTGRES_PASSWORD: ownpilot_ci_password
          POSTGRES_DB: ownpilot
          AUTH_TYPE: jwt
          MEMORY_SALT: test-only-astra-e2e-salt
          OWNPILOT_DATA_DIR: /tmp/astra-e2e-data
        run: |
          set -euo pipefail
          export BOOTSTRAP_TOKEN="$(openssl rand -hex 40)"
          export JWT_SECRET="$(openssl rand -hex 40)"
          mkdir -p /tmp/astra-e2e-data
          nohup node packages/gateway/dist/server.js >/tmp/astra-e2e.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null 2>&1; then break; fi
            if [ "$i" -eq 90 ]; then tail -n 80 /tmp/astra-e2e.log; exit 1; fi
            sleep 2
          done
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/auth/password \
            -H "Content-Type: application/json" \
            -H "X-Bootstrap-Token: $BOOTSTRAP_TOKEN" \
            --data '{"password":"OwnPilot2026!"}' > /tmp/astra-e2e-bootstrap.json
          node -e 'if(!require("/tmp/astra-e2e-bootstrap.json").success) process.exit(1)'

      - name: Playwright E2E
        # Preserve the same test selection, worker count and failure gate.
        run: pnpm --filter @ownpilot/ui exec playwright test --max-failures=8 --workers=2
        env:
          CI: 'true'

      - name: Upload WhatsApp access UI checks
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whatsapp-access-ui
          path: packages/ui/test-results/**/whatsapp-access-*.png
          if-no-files-found: ignore
          retention-days: 7

  windows-checks:
    name: Windows checks
    # Primary development happens on Windows, but CI ran only ubuntu — so the
    # platform where the code is written was the one platform never verified.
    # Two bug classes in this repo are Windows-specific and would pass a Linux
    # run untouched:
    #   - `localhost` resolving to ::1 while Docker publishes on IPv4 only
    #     (documented in .env.example)
    #   - the @tailwindcss/oxide native scanner silently falling back to WASM
    #     and emitting a utility-less stylesheet, which `cssSizeGuard` in
    #     packages/ui/vite.config.ts exists to catch — and which only fires
    #     during `build`
    #
    # PRs only: these classes are introduced by code changes, which PRs gate.
    # The gateway suite is excluded for now to keep this job fast; extend once
    # it has proven stable.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: TypeCheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (core, cli, ui)
        run: pnpm --filter @ownpilot/core --filter @ownpilot/cli --filter @ownpilot/ui test

  coverage:
    name: Coverage report
    # Measure the same PostgreSQL paths that release qualification exercises.
    # Run before merging as well, so a missing coverage gate cannot reach main.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: astratest
          POSTGRES_PASSWORD: radar-local-tests-only
          POSTGRES_DB: astratest_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astratest -d astratest_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL 16 preservation qualification client
        timeout-minutes: 8
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-astra-download-timeouts >/dev/null
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump --version
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"

      - name: Verify and prepare disposable coverage databases
        env:
          PGPASSWORD: radar-local-tests-only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U astratest -d astratest_radar <<'SQL'
          DO $$ BEGIN
            IF current_database() <> 'astratest_radar' OR current_user <> 'astratest' THEN
              RAISE EXCEPTION 'Refusing non-laboratory database';
            END IF;
          END $$;
          CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;
          CREATE ROLE astra_auth_lab LOGIN PASSWORD 'astra_customer_pg_ci_only';
          CREATE DATABASE astra_auth_verification_lab OWNER astra_auth_lab;
          SQL

      - name: Core, CLI and UI coverage
        run: TURBO_FORCE=true pnpm test:coverage --filter='!@ownpilot/gateway'

      - name: Build gateway for PostgreSQL coverage
        run: pnpm --filter @ownpilot/gateway build

      - name: Gateway coverage with real PostgreSQL isolation and recovery
        env:
          # Direct invocation preserves these explicit laboratory opt-ins;
          # Turbo's strict environment intentionally filters unknown variables.
          DATABASE_URL: ''
          ASTRA_RADAR_TEST_PORT: '5432'
          ASTRA_REVIEW_PG_PORT: '5432'
          ASTRA_REVIEW_PG_DATABASE: astratest_radar
          ASTRA_REVIEW_PG_USER: astratest
          ASTRA_REVIEW_PG_PASSWORD: radar-local-tests-only
          ASTRA_REVIEW_PG_VECTOR: 'true'
          ASTRA_AUTH_TEST_PORT: '5432'
          PGPASSWORD: astra_customer_pg_ci_only
        run: >-
          pnpm --filter @ownpilot/gateway test:coverage
          --maxWorkers=4 --reporter=default --reporter=json
          --outputFile.json="${RUNNER_TEMP}/astra-gateway-coverage-tests.json"

      - name: Require actual PostgreSQL test execution in the coverage report
        env:
          TEST_REPORT: ${{ runner.temp }}/astra-gateway-coverage-tests.json
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.TEST_REPORT, 'utf8'));
          assert.equal(report.success, true, 'The instrumented suite must pass');
          const required = [
            'src/db/repositories/customer-radar.pg.test.ts',
            'src/db/repositories/finance-obligations.pg.test.ts',
            'src/db/repositories/channel-reminders-delivery.pg.test.ts',
            'src/db/repositories/memory-integrity.pg.test.ts',
            'src/channels/auth/verification-postgres.test.ts',
            'src/channels/personal-subscriptions.pg.test.ts',
            'src/channels/personal-tasks.pg.test.ts',
            'src/channels/calendar-mutation.pg.test.ts',
            'src/release-backup.pg.test.ts',
          ];
          for (const path of required) {
            const suites = report.testResults.filter((suite) => suite.name.endsWith('/' + path));
            assert.equal(suites.length, 1, 'Expected exactly one collected suite: ' + path);
            const suite = suites[0];
            assert.equal(suite.status, 'passed', 'PostgreSQL suite must pass: ' + path);
            assert.ok(suite.assertionResults.length > 0, 'PostgreSQL suite must not be empty: ' + path);
            for (const test of suite.assertionResults) {
              assert.equal(test.status, 'passed', 'PostgreSQL test must execute: ' + test.fullName);
            }
            console.log(JSON.stringify({ suite: path, passed: suite.assertionResults.length, skipped: 0 }));
          }
          JS

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports
          path: |
            packages/*/coverage
            ${{ runner.temp }}/astra-gateway-coverage-tests.json
          retention-days: 14
          if-no-files-found: error

  migration-smoke-test:
    name: Migration smoke test (pgvector/pg16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ownpilot
          POSTGRES_PASSWORD: ownpilot_ci_password
          POSTGRES_DB: ownpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The smoke test imports gateway source via tsx, which in turn imports
      # `@ownpilot/core` — and gateway's resolution points at core's compiled
      # `dist/index.js`. Without this build step the smoke test fails with
      # `Cannot find module '@ownpilot/core/dist/index.js'` before it ever
      # touches the database.
      - name: Build core dependency
        run: pnpm --filter @ownpilot/core build

      - name: Run migration smoke test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: ownpilot
          POSTGRES_PASSWORD: ownpilot_ci_password
          POSTGRES_DB: ownpilot
        run: pnpm --filter @ownpilot/gateway exec tsx scripts/migration-smoke-test.ts

  gateway-boot-smoke-test:
    name: Gateway boot smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ownpilot
          POSTGRES_PASSWORD: ownpilot_ci_password
          POSTGRES_DB: ownpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same reason as the migration smoke test: gateway source resolves
      # `@ownpilot/core` to its compiled dist.
      - name: Build core dependency
        run: pnpm --filter @ownpilot/core build

      - name: Boot gateway and probe /health/ready
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_USER: ownpilot
          POSTGRES_PASSWORD: ownpilot_ci_password
          POSTGRES_DB: ownpilot
          PORT: '18080'
        # End-to-end boot check: the gateway must come up against a fresh
        # database, create its schema (initializeSchema from db/schema/*.ts),
        # and report ready. /health/ready verifies the critical tables exist,
        # so a runtime-schema regression fails here even when unit tests pass.
        run: |
          pnpm --filter @ownpilot/gateway exec tsx src/server.ts > gateway.log 2>&1 &
          GATEWAY_PID=$!
          trap 'kill "$GATEWAY_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health/ready > ready.json 2>/dev/null; then
              echo "Gateway ready after ~$((i * 2))s"
              cat ready.json
              echo
              curl -fsS http://127.0.0.1:18080/health
              exit 0
            fi
            if ! kill -0 "$GATEWAY_PID" 2>/dev/null; then
              echo "Gateway process exited before becoming ready"
              tail -n 100 gateway.log
              exit 1
            fi
            sleep 2
          done

          echo "Gateway did not become ready within 120s"
          tail -n 100 gateway.log
          exit 1
