name: Astra release candidate Docker smoke
on:
  push:
    branches:
      - test/astra-docker-1001639e-20261107
    paths:
      - .github/workflows/astra-docker-candidate-smoke.yml
permissions:
  contents: read
jobs:
  docker-build:
    if: github.repository == 'QGBALTIGO/astra'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/astra-docker-1001639e-20261107
          fetch-depth: 0
      - name: Verify reviewed Astra source commit
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1001639e735d6c7795abd04f6007e7f20fd9e3ed HEAD
          # The only delta from the validated candidate is this disposable CI file.
          test "$(git diff --name-only 1001639e735d6c7795abd04f6007e7f20fd9e3ed HEAD)" = ".github/workflows/astra-docker-candidate-smoke.yml"
          git show --oneline --stat HEAD
      - name: Build candidate Docker image without publishing
        run: docker build --progress=plain --tag astra-review:1001639e .
      - name: Inspect production image runtime
        run: |
          docker image inspect astra-review:1001639e --format '{{.Id}} {{.Architecture}} {{.Config.User}}'
          docker run --rm --entrypoint node astra-review:1001639e --version
      - name: Verify native terminal dependency is actually loadable
        run: |
          docker run --rm -w /app/packages/gateway --entrypoint node astra-review:1001639e -e "const pty=require('node-pty'); if(typeof pty.spawn!=='function') throw Error('node-pty unavailable'); console.log('node-pty native module ready')"
      - name: Confirm no registry publishing was performed
        run: echo "The image was only built on this runner; no push or deployment was requested."
