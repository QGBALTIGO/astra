name: Astra onboarding production monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: astra-onboarding-production-monitor
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'QGBALTIGO/astra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Read-only onboarding readiness and deduplicated incident
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/astra-onboarding-monitor.mjs
