name: Isolate Firefox demo scan
on: push
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps firefox
      - run: |
          node preview.mjs > /tmp/preview.log 2>&1 &
          node firefox-scan-diagnostic.mjs
