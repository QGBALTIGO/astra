name: Astra visual one-shot formatting
on:
  push:
    branches:
      - design/astra-orion-visual-system-20261107
    paths:
      - .github/workflows/astra-orion-one-shot-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Astra Orion design files
        run: >-
          pnpm exec prettier --write packages/ui/e2e/astra-orion-design.spec.ts packages/ui/e2e/sidebar.spec.ts packages/ui/src/components/Layout.tsx packages/ui/src/components/ProvidersTab.tsx packages/ui/src/components/Sidebar.tsx packages/ui/src/components/ai-models/AIModelsTab.tsx packages/ui/src/components/sidebar/PinnedNavLink.tsx packages/ui/src/constants/sidebar-sections.ts packages/ui/src/hooks/useLayoutConfig.tsx packages/ui/src/index.css packages/ui/src/pages/ChannelsPage.tsx packages/ui/src/pages/DashboardPage.tsx packages/ui/src/pages/ProvidersPage.tsx packages/ui/src/pages/channels-detail.tsx packages/ui/src/types/layout-config.ts
      - name: Commit formatted code and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git add packages/ui/e2e/astra-orion-design.spec.ts packages/ui/e2e/sidebar.spec.ts packages/ui/src/components/Layout.tsx packages/ui/src/components/ProvidersTab.tsx packages/ui/src/components/Sidebar.tsx packages/ui/src/components/ai-models/AIModelsTab.tsx packages/ui/src/components/sidebar/PinnedNavLink.tsx packages/ui/src/constants/sidebar-sections.ts packages/ui/src/hooks/useLayoutConfig.tsx packages/ui/src/index.css packages/ui/src/pages/ChannelsPage.tsx packages/ui/src/pages/DashboardPage.tsx packages/ui/src/pages/ProvidersPage.tsx packages/ui/src/pages/channels-detail.tsx packages/ui/src/types/layout-config.ts
          git rm .github/workflows/astra-orion-one-shot-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(astra): format Orion visual system and responsive checks"
          git push origin HEAD:design/astra-orion-visual-system-20261107
