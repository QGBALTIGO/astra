name: Astra setup formatting and verified image
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-astra-setup.yml
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  format-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Astra setup files
        run: pnpm exec prettier --write packages/ui/public/astra-setup.css packages/ui/public/astra-setup.html packages/ui/public/astra-setup.js
      - name: Verify formatting and dependency security
        run: |
          pnpm format:check
          pnpm audit:prod
      - name: Build and typecheck
        run: |
          pnpm build
          pnpm typecheck
      - name: Commit formatted files only
        shell: bash
        run: |
          set -euo pipefail
          git add packages/ui/public/astra-setup.css packages/ui/public/astra-setup.html packages/ui/public/astra-setup.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(astra): format first-run password setup"
            git push origin HEAD:main
          fi
          echo "ASTRA_IMAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified immutable Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/qgbaltigo/astra:sha-${{ env.ASTRA_IMAGE_SHA }}
            ghcr.io/qgbaltigo/astra:setup-verified
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/QGBALTIGO/astra
            org.opencontainers.image.revision=${{ env.ASTRA_IMAGE_SHA }}
