name: Astra setup formatting and verified image
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-astra-setup.yml
      - packages/ui/src/pages/ChatPage.starters.ts
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  format-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatar interface Astra em pt-BR
        run: >-
          pnpm exec prettier --write packages/ui/public/astra-setup.css packages/ui/public/astra-setup.html packages/ui/public/astra-setup.js packages/ui/index.html packages/ui/src/main.tsx packages/ui/src/constants/nav-items.ts packages/ui/src/types/layout-config.ts packages/ui/src/components/Layout.tsx packages/ui/src/components/Sidebar.tsx packages/ui/src/pages/LoginPage.tsx packages/ui/src/index.css packages/ui/src/App.tsx packages/ui/src/pages/ProvidersPage.tsx packages/ui/src/pages/DashboardPage.tsx packages/ui/src/components/ChatStarterPrompts.tsx packages/ui/src/components/ChatInput.tsx packages/ui/src/pages/ChatPage.tsx packages/ui/src/pages/ChatPage.starters.ts packages/ui/src/pages/TasksPage.tsx packages/ui/src/pages/CalendarPage.tsx packages/ui/src/pages/ExpensesPage.tsx packages/ui/src/components/ProvidersTab.tsx packages/ui/src/i18n/ptBR.ts packages/gateway/src/services/app-settings.ts packages/gateway/src/routes/settings.ts packages/gateway/src/routes/providers.ts packages/gateway/src/routes/models.ts packages/core/data/providers/groq.json packages/ui/src/pages/ChannelsPage.tsx packages/ui/src/components/ChatInput.test.tsx packages/ui/src/components/ChatStarterPrompts.window.test.tsx packages/ui/src/pages/CalendarPage.header.test.tsx packages/ui/src/pages/ExpensesPage.row-date.test.tsx packages/core/src/memory/encryption.test.ts packages/gateway/src/server.ts packages/ui/src/hooks/useLayoutConfig.tsx packages/ui/src/components/ChannelSetupModal.tsx packages/gateway/src/db/schema/finance.ts packages/gateway/src/db/schema/index.ts packages/gateway/src/db/schema/index.test.ts packages/gateway/src/db/repositories/expenses.ts packages/gateway/src/db/repositories/expenses.test.ts packages/gateway/src/routes/expenses.ts packages/gateway/src/routes/health.ts packages/gateway/scripts/migration-smoke-test.ts packages/gateway/src/services/dashboard/briefing.ts packages/core/src/credentials/index.test.ts packages/ui/src/components/sidebar/SidebarFooter.tsx packages/ui/src/pages/NotesPage.tsx packages/ui/src/pages/ContactsPage.tsx packages/ui/src/pages/MemoriesPage.tsx packages/ui/src/pages/GoalsPage.tsx packages/ui/src/pages/TriggersPage.tsx packages/ui/src/pages/ChatHistoryPage.tsx packages/ui/src/pages/HabitsPage.tsx packages/ui/e2e/astra-route-audit.spec.ts packages/ui/e2e/astra-audit.config.ts
      - name: Registrar correções de formatação
        shell: bash
        run: |
          set -euo pipefail
          git add packages/ui/public/astra-setup.css packages/ui/public/astra-setup.html packages/ui/public/astra-setup.js packages/ui/index.html packages/ui/src/main.tsx packages/ui/src/constants/nav-items.ts packages/ui/src/types/layout-config.ts packages/ui/src/components/Layout.tsx packages/ui/src/components/Sidebar.tsx packages/ui/src/pages/LoginPage.tsx packages/ui/src/index.css packages/ui/src/App.tsx packages/ui/src/pages/ProvidersPage.tsx packages/ui/src/pages/DashboardPage.tsx packages/ui/src/components/ChatStarterPrompts.tsx packages/ui/src/components/ChatInput.tsx packages/ui/src/pages/ChatPage.tsx packages/ui/src/pages/ChatPage.starters.ts packages/ui/src/pages/TasksPage.tsx packages/ui/src/pages/CalendarPage.tsx packages/ui/src/pages/ExpensesPage.tsx packages/ui/src/components/ProvidersTab.tsx packages/ui/src/i18n/ptBR.ts packages/gateway/src/services/app-settings.ts packages/gateway/src/routes/settings.ts packages/gateway/src/routes/providers.ts packages/gateway/src/routes/models.ts packages/core/data/providers/groq.json packages/ui/src/pages/ChannelsPage.tsx packages/ui/src/components/ChatInput.test.tsx packages/ui/src/components/ChatStarterPrompts.window.test.tsx packages/ui/src/pages/CalendarPage.header.test.tsx packages/ui/src/pages/ExpensesPage.row-date.test.tsx packages/core/src/memory/encryption.test.ts packages/gateway/src/server.ts packages/ui/src/hooks/useLayoutConfig.tsx packages/ui/src/components/ChannelSetupModal.tsx packages/gateway/src/db/schema/finance.ts packages/gateway/src/db/schema/index.ts packages/gateway/src/db/schema/index.test.ts packages/gateway/src/db/repositories/expenses.ts packages/gateway/src/db/repositories/expenses.test.ts packages/gateway/src/routes/expenses.ts packages/gateway/src/routes/health.ts packages/gateway/scripts/migration-smoke-test.ts packages/gateway/src/services/dashboard/briefing.ts packages/core/src/credentials/index.test.ts packages/ui/src/components/sidebar/SidebarFooter.tsx packages/ui/src/pages/NotesPage.tsx packages/ui/src/pages/ContactsPage.tsx packages/ui/src/pages/MemoriesPage.tsx packages/ui/src/pages/GoalsPage.tsx packages/ui/src/pages/TriggersPage.tsx packages/ui/src/pages/ChatHistoryPage.tsx packages/ui/src/pages/HabitsPage.tsx packages/ui/e2e/astra-route-audit.spec.ts packages/ui/e2e/astra-audit.config.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(astra): format Portuguese interface and Groq integration"
            git push origin HEAD:main
          fi
          echo "ASTRA_IMAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify formatting and dependency security
        run: |
          pnpm format:check
          pnpm audit:prod
      - name: Build and typecheck
        run: |
          pnpm build
          pnpm typecheck
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified immutable Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/qgbaltigo/astra:sha-${{ env.ASTRA_IMAGE_SHA }}
            ghcr.io/qgbaltigo/astra:setup-verified
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/QGBALTIGO/astra
            org.opencontainers.image.revision=${{ env.ASTRA_IMAGE_SHA }}
