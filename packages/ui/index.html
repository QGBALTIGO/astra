<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Astra — seu assistente pessoal com IA, agenda, tarefas e finanças."
    />
    <!--
      Baseline Content Security Policy. The gateway also sets a stricter
      CSP via secure-headers when serving the production bundle; this
      meta tag is the fallback for dev (Vite) and any non-gateway hosting.
      Notes:
      - 'unsafe-inline' on style-src is required by Tailwind runtime
        utility injection. All HTML injection sinks in the app route
        through DOMPurify with strict allow-listing.
      - 'unsafe-inline' on script-src is dev-only for Vite HMR; the
        gateway overrides with a 'self'-only policy in production via
        the CSP header (header trumps meta when both are present).
      - object-src 'none' and frame-src 'none' block legacy plugin XSS.
      - frame-ancestors is enforced via header (meta cannot set it).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; media-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Astra | Assistente pessoal</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Minimal critical styles keep the loading screen legible before Vite/React loads. -->
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; }
      .astra-boot-screen {
        box-sizing: border-box;
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        padding: 32px 20px;
        background: #f6f8fb;
        color: #1d2b43;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .astra-boot-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100%, 320px);
      }
      .astra-boot-brand { display: block; width: 154px; max-width: 100%; }
      .astra-boot-brand img { display: block; width: 100%; height: auto; }
      .astra-boot-track {
        overflow: hidden;
        width: 132px;
        height: 3px;
        margin-top: 32px;
        border-radius: 100px;
        background: #dfe7f2;
      }
      .astra-boot-track span {
        display: block;
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: #376de0;
        animation: astra-boot-slide 1.5s ease-in-out infinite;
      }
      @keyframes astra-boot-slide {
        from { transform: translateX(-125%); }
        to { transform: translateX(300%); }
      }
      .astra-boot-message {
        margin: 16px 0 0;
        color: #617086;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.55;
      }
      .astra-boot-recovery {
        display: grid;
        justify-items: center;
        gap: 14px;
        margin-top: 32px;
      }
      .astra-boot-recovery p { margin: 0; color: #617086; font-size: 13px; }
      .astra-boot-recovery button {
        min-height: 44px;
        padding: 10px 20px;
        border: 1px solid #ccd7e6;
        border-radius: 12px;
        background: #fff;
        color: #254c9e;
        font: 600 13px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        cursor: pointer;
      }
      .astra-boot-recovery button:focus-visible { outline: 2px solid #376de0; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        .astra-boot-screen { background: #0b101b; color: #f0f4fc; }
        .astra-boot-track { background: #24324b; }
        .astra-boot-track span { background: #80a8ff; }
        .astra-boot-message, .astra-boot-recovery p { color: #a7b7cd; }
        .astra-boot-recovery button { background: #152033; color: #d3e3ff; border-color: #30415b; }
      }
      @media (prefers-reduced-motion: reduce) {
        .astra-boot-track span { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="astra-boot-screen" role="status" aria-live="polite">
        <div class="astra-boot-content">
          <picture class="astra-boot-brand">
            <source media="(prefers-color-scheme: dark)" srcset="/astra-logo.svg" />
            <img src="/astra-logo-light.svg" alt="Astra" width="1400" height="355" />
          </picture>
          <div class="astra-boot-track" aria-hidden="true"><span></span></div>
          <p class="astra-boot-message">Preparando seu espaço…</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
